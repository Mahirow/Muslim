    <style>
      /* ============================================================
         CRITICAL INLINE CSS — styled first paint while the app loads.
         Calm, premium: forest green · muted gold · cream.
         The full design system (src/design-system.css) refines this.
         ============================================================ */
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f4f2ec;
        color: #24312c;
        line-height: 1.6;
        min-height: 100dvh;
      }
      html[data-theme="dark"] body { background: #0d1512; color: #e7ede9; }
      #app {
        position: relative;
        max-width: 520px;
        margin: 0 auto;
        min-height: 100dvh;
        background: #f8f7f2;
      }
      html[data-theme="dark"] #app { background: #101915; }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: linear-gradient(160deg, #1e5340, #173f32 60%, #12312a);
        color: #fff;
        padding: calc(10px + env(safe-area-inset-top)) 16px 0;
      }
      .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand-logo {
        display: grid; place-items: center;
        width: 38px; height: 38px; border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #d9b678;
        flex: none;
      }
      .brand-name { font-size: 1.15rem; font-weight: 700; letter-spacing: 0; line-height: 1.1; color: #fff; }
      .brand-ar { color: #d9b678; font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif; font-weight: 700; }
      .brand-tag { font-size: 0.62rem; color: rgba(231, 244, 236, 0.72); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 3px; }
      .header-right { display: flex; align-items: center; gap: 8px; flex: none; }
      .icon-btn {
        position: relative;
        width: 40px; height: 40px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.08);
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer; flex: none; color: #e9f3ec;
      }
      .acct-initial { font-size: 0.88rem; font-weight: 700; line-height: 1; color: #d9b678; }
      .acct-dot {
        position: absolute; right: -1px; bottom: -1px;
        width: 10px; height: 10px; border-radius: 50%;
        background: #7c8a83; border: 2px solid #173f32;
      }
      .acct-dot.on { background: #7fd1a0; }
      .theme-btn .ico-sun { display: none; }
      html[data-theme="dark"] .theme-btn .ico-sun { display: block; }
      html[data-theme="dark"] .theme-btn .ico-moon { display: none; }
      .hijri-chip {
        font-size: 0.68rem;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #e9f3ec;
        padding: 5px 10px;
        border-radius: 999px;
        white-space: nowrap;
        max-width: 44%;
        overflow: hidden; text-overflow: ellipsis;
      }
      .bismillah {
        margin-top: 8px; text-align: center;
        font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
        font-size: 1.04rem; color: rgba(233, 243, 236, 0.82);
        padding: 8px 0 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      #content { padding: 16px 16px calc(62px + 32px + env(safe-area-inset-bottom)); }
      .bottom-nav {
        position: fixed;
        bottom: 0; left: 50%; transform: translateX(-50%);
        width: 100%; max-width: 520px; z-index: 60;
        display: flex;
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid #e6e3d9;
        padding-bottom: env(safe-area-inset-bottom);
      }
      html[data-theme="dark"] .bottom-nav { background: rgba(15, 26, 21, 0.98); border-top-color: #24362d; }
      .nav-btn {
        flex: 1;
        display: flex; flex-direction: column; align-items: center; gap: 3px;
        padding: 8px 2px;
        background: none; border: none; cursor: pointer;
        color: #7b8981; font-family: inherit; min-height: 56px;
      }
      html[data-theme="dark"] .nav-btn { color: #7f9187; }
      .nav-icon { display: grid; place-items: center; width: 44px; height: 28px; border-radius: 999px; }
      .nav-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.02em; }
      .nav-btn.active { color: #1e5340; }
      .nav-btn.active .nav-icon { background: #e9f1ea; color: #1e5340; }
      .nav-btn.active .nav-label { color: #1e5340; font-weight: 700; }
      html[data-theme="dark"] .nav-btn.active { color: #e7ede9; }
      html[data-theme="dark"] .nav-btn.active .nav-icon { background: rgba(63, 138, 109, 0.16); color: #3f8a6d; }
      html[data-theme="dark"] .nav-btn.active .nav-label { color: #3f8a6d; }

      /* ---- boot splash ---- */
      .boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 70px 24px 40px;
        text-align: center;
      }
      .boot-logo {
        width: 84px; height: 84px;
        border-radius: 22px;
        background: linear-gradient(160deg, #1e5340, #12312a);
        display: grid; place-items: center;
        color: #d9b678;
        box-shadow: 0 14px 34px -14px rgba(18, 58, 44, 0.5);
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .boot-name { font-size: 1.4rem; font-weight: 800; color: #1e5340; }
      html[data-theme="dark"] .boot-name { color: #e7ede9; }
      .boot-name span { color: #a87c33; font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif; }
      .boot-bar {
        width: 150px; height: 4px;
        border-radius: 999px;
        background: #e9f1ea;
        overflow: hidden;
      }
      .boot-bar i {
        display: block; height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #2b6a52;
        animation: bootSlide 1.1s ease-in-out infinite;
      }
      @keyframes bootSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      .boot-sub { font-size: 0.76rem; color: #7b8981; letter-spacing: 0.04em; }
      html[data-theme="dark"] .boot-sub { color: #7f9187; }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }
    </style>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('noor.theme'));
          var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
                     (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
          var f = JSON.parse(localStorage.getItem('noor.font'));
          if (f && f !== 'normal') document.documentElement.setAttribute('data-font', f);
        } catch (e) { /* noop */ }
      })();
    </script>
